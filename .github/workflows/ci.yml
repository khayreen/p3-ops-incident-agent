name: tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - name: Unit, graph and attack tests
        run: pytest -q
      - name: Scenarios are reproducible from the generator
        run: python -m scenarios.generate && git diff --exit-code scenarios
      - name: Baseline evaluation (no API key needed)
        run: python -m eval.run_eval --policy playbook
